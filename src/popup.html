<!DOCTYPE html>
<html>

<head>
    <title>Chrome Analytics</title>
    <link rel="stylesheet" type="text/css" href="popup.css">
</head>

<body>
    <div id="content">
        <h1>Chrome Analytics</h1>
        <p>This is a Chrome extension that tracks browsing activity and provides analytics.</p>
    </div>
    <div id="buttons">
        <button id="startTracking">Start Tracking</button>
        <button id="stopTracking">Stop Tracking</button>
        <button id="viewAnalytics">View Analytics</button>
        <button id="clearData">Clear Data</button>
        <button id="exportData">Export Data</button>
        <button id="importData">Import Data</button>
        <button id="settings">Settings</button>
    </div>
    <script src="popup.js"></script>
</body>

</html>
